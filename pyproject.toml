[project]
name = "rbl"
version = "0.1.0"
description = "Revisiting Simple Baselines for Relational Deep Learning"
requires-python = ">=3.10"
dependencies = [
    "relbench>=1.1",
    "torch>=2.1",
    "pytorch_frame>=0.2",
    "torch_geometric>=2.4",
    "pytorch-lightning>=2.1",
    "sentence-transformers>=2.3",
    "scipy>=1.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[tool.setuptools]
packages = ["rbl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
